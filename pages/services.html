<!DOCTYPE html>
<html lang="ar" dir="rtl">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <meta name="description" content="أويلـي لمعدات الأمن والسلامة ومكافحة الحرائق، نقدم أحدث حلول الأمن والسلامة لمواجهة جميع التحديات الطارئة">
        <meta name="keywords" content="أويلي, اويلي, معدات سلامة, مكافحةالحرائق، حلول الأمن, اويلي لمعدات السلامة، Oily">

        <link rel="icon" href="/public/logo_icon.ico">

        <!-- Icons -->
        <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/2.5.1/uicons-thin-straight/css/uicons-thin-straight.css'>
        <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/2.5.1/uicons-brands/css/uicons-brands.css'>
        <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/2.5.1/uicons-regular-rounded/css/uicons-regular-rounded.css'>

        <!-- Style -->
        <link rel="stylesheet" href="../asset/styles/index.min.css">

        <title>أويـلي | الخدمات</title>
    </head>

    <body>
        <!-- for the navbar -->
        <header></header>

        <!-- Header page -->
        <section class="header-page center">
            <h1>الخدمات</h1>
        </section>

        <main id="services-container" class="cards-container">
            <!-- <article class="card">
                <section class="img center">
                    <img src="./asset/images/Image.png" alt="product's image">
                </section>

                <p>
                    خوذة سلامة نظام أمريكي بفتحات تهوئة متوفرة بعدة الوان
                </p>
            </article> -->
        </main>

        <footer class="footer"></footer>

        <script type="module">
            import Navbar from '../components/navbar.js';
            import Footer from '../components/footer.js';

            Navbar();
            Footer();

            const services = [
                {
                    id: 1,
                    service: "نظام مضخات الحريق",
                    img: "Frame"
                },
                {
                    id: 2,
                    service: "نظام انذار الحرائق",
                    img: "Frame-2"
                },
                {
                    id: 3,
                    service: "نظام مكافحة الحرائق",
                    img: "Group-1"
                },
                {
                    id: 4,
                    service: "سيارة إطفاء",
                    img: "Frame-3"
                },
                {
                    id: 5,
                    service: "السلامة البحرية",
                    img: "Group 1875"
                },
                {
                    id: 6,
                    service: "معدات السلامة",
                    img: "Frame-1"
                },
                {
                    id: 7,
                    service: "الحلول الهندسية",
                    img: "Frame-4"
                },
                {
                    id: 8,
                    service: "ادوات المختبر",
                    img: "Group 1876"
                },
                {
                    id: 9,
                    service: "نظام المراقة",
                    img: "Group"
                },
            ];

            const servicesContainer = document.getElementById('services-container');

            services.forEach(e => {
                servicesContainer.innerHTML += `
                    <article class="service card" key=${e.id}>
                        <section class="icon icon-red center">
                            <img src="/asset/icons/${e.img}.svg" alt="icon">
                        </section>

                        <header>
                            <h3>${e.service}</h3>
                        </header>
                    </article>
                `;
            });

            const cards = document.querySelectorAll('#services-container .card');

            cards.forEach(e => e.classList.add('showing'));
        </script>
        <script src="../asset/js/products.js"></script>
    </body>
</html>
