<!DOCTYPE html>
<html lang="ar" dir="rtl">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <meta name="description" content="أويلـي لمعدات الأمن والسلامة ومكافحة الحرائق، نقدم أحدث حلول الأمن والسلامة لمواجهة جميع التحديات الطارئة">
        <meta name="keywords" content="أويلي, اويلي, معدات سلامة, مكافحةالحرائق، حلول الأمن, اويلي لمعدات السلامة، Oily">

        <link rel="icon" href="/public/logo_icon.ico">

        <!-- Icons -->
        <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/2.5.1/uicons-thin-straight/css/uicons-thin-straight.css'>
        <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/2.5.1/uicons-brands/css/uicons-brands.css'>
        <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/2.5.1/uicons-regular-rounded/css/uicons-regular-rounded.css'>

        <!-- Style -->
        <link rel="stylesheet" href="../asset/styles/index.min.css">

        <title>أويـلي | العملاء</title>
    </head>

    <body>
        <!-- for the navbar -->
        <header></header>

        <!-- Header page -->
        <section class="header-page center">
            <h1>عملائنا</h1>
        </section>

        <main id="customers-container" class="cards-container">
            <!-- <article class="card">
                <section class="img center">
                    <img src="./asset/images/Image.png" alt="product's image">
                </section>

                <p>
                    خوذة سلامة نظام أمريكي بفتحات تهوئة متوفرة بعدة الوان
                </p>
            </article> -->
        </main>

        <footer class="footer"></footer>

        <script type="module">
            import Navbar from '../components/navbar.js';
            import Footer from '../components/footer.js';

            Navbar();
            Footer();

            const customers = [
                {
                    id: 1,
                    name: "نما",
                    logo: "Gov_Logo-5"
                },
                {
                    id: 2,
                    name: "وزارة الصناعة والثروة المعدنية",
                    logo: "Gov_Logo-4"
                },
                {
                    id: 3,
                    name: "اعتماد",
                    logo: "Gov_Logo-3"
                },
                {
                    id: 4,
                    name: "سكني",
                    logo: "Gov_Logo-2"
                },
                {
                    id: 5,
                    name: "ايجار",
                    logo: "Gov_Logo-1"
                },
                {
                    id: 6,
                    name: "وزارة الإستثمار",
                    logo: "Gov_Logo"
                },
            ];

            const customersContainer = document.getElementById('customers-container');

            customers.forEach(e => {
                customersContainer.innerHTML += `
                    <article class="card">
                        <section class="img center">
                            <img src="/asset/images/${e.logo}.png" alt="Customer's logo">
                        </section>

                        <p>${e.name}</p>
                    </article>
                `;
            });

            const customersContainerTopOffset = customersContainer.offsetTop;

            if (customersContainerTopOffset < 500) {
                const cards = document.querySelectorAll('#customers-container .card');

                cards.forEach(e => e.classList.add('showing'));
            };
        </script>
        <script src="../asset/js/products.js"></script>
    </body>
</html>
